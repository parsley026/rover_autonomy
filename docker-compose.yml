services:
  ros-autonomy:
    build:
      context: .
      dockerfile: ./.devcontainer/Dockerfile
      args:
        SSH_PORT: 2922
    image: ros-autonomy
    container_name: ros-autonomy
    hostname: ros-autonomy
    stdin_open: true
    tty: true
    pid: "host"
    ipc: "host"
    init: true
    network_mode: host
    extra_hosts:
      - "ros-autonomy=127.0.0.1"
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - video
      - render
    environment:
      - TZ=Europe/Warsaw
      - ROS_ENABLE_AUTOSTART=1
      - ROS_BUILD_ON_STARTUP=on-failure
      
      # - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1

      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/fastdds_shm.xml
  
      # - XAUTHORITY=/root/.Xauthority
    volumes:
      - type: bind
        source: ./
        target: /mnt/local
        bind:
          create_host_path: false
      - type: bind
        source: ./.devcontainer/rex
        target: /etc/init.d/rex
        bind:
          create_host_path: false
      - type: bind
        source: "${REX_CONTAINER_AUTHORIZED_KEYS:-/dev/null}"
        target: /run/secrets/authorized_keys
        read_only: true # Make sure this stays read-only!
        bind:
          create_host_path: false

      - ./map:/home/rex/raptor_ws/map
      
      - ./src:/home/rex/raptor_ws/src

      - /dev:/dev
      - /run/udev:/run/udev:ro

      - ./fastdds_shm.xml:/fastdds_shm.xml:ro
      
      # - /tmp/.X11-unix:/tmp/.X11-unix
      # - ${XAUTHORITY}:/root/.Xauthority:ro
    restart: unless-stopped
