global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [0.60, 0.40], [0.60, -0.40], [-0.60, -0.40], [-0.60, 0.40] ]'
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      rolling_window: false
      width: 20
      height: 20
      origin_x: -10.0
      origin_y: -10.0
      track_unknown_space: false
      update_frequency: 1.0
      publish_frequency: 1.0
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /mapping/map          # rtabmap publishes here
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar       # camera0 removed — no /camera_00/points topic
        lidar:
          topic: /lidar_00/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 0.85

local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [0.60, 0.40], [0.60, -0.40], [-0.60, -0.40], [-0.60, 0.40] ]'
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins:
        - voxel_layer
        - inflation_layer
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: lidar       # camera0 removed — no /camera_00/points topic
        lidar:
          topic: /lidar_00/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1       # ignore ground returns
          obstacle_max_range: 6.0
          obstacle_min_range: 0.25       # ignore rover body returns
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 0.85
