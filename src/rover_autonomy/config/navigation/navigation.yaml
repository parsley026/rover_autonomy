bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odometry/filtered  # EKF output under localization namespace
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: "disabled"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - drive_on_heading
      - follow_object
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - smoother
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001        # lowered so slow motion isn't filtered out
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandler"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3        # reduced — rover makes slower progress on terrain
      movement_time_allowance: 15.0        # more time before declaring stuck

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
      path_length_tolerance: 1.0

    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      minimum_rotation_angle: 0.785

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56                       # reduced for faster iteration on embedded HW
      model_dt: 0.05
      batch_size: 2000

      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0                          # Ackermann — no lateral acceleration
      ay_min: 0.0

      az_max: 1.0

      vx_max: 0.8                          # conservative outdoor max speed (m/s)
      vx_min: -0.4                         # allow gentle reversing
      vy_max: 0.0                          # Ackermann — no lateral velocity
      vy_min: 0.0

      wz_max: 1.0                          # max yaw rate (rad/s)

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      visualize: false

      motion_model: "Ackermann"
      Ackermann:
        plugin: "nav2_mppi_controller::AckermannMotionModel"
        min_turning_r: 1.0                 # match hardware minimum steering radius

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "nav2_mppi_controller::TrajectoryValidator"
        collision_lookahead_time: 2.0

      critics:
        ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
         "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
        cost_power: 1

      GoalCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 1.0

      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 0

      PreferForwardCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1

      CostCritic:
        enabled: true
        cost_weight: 3.81
        cost_power: 1
        critical_cost: 300.0
        consider_footprint: true           # use actual footprint not circle
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      PathAlignCritic:
        enabled: true
        cost_weight: 14.0                  # boosted — keeps rover on planned path
        cost_power: 1
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      PathAngleCritic:
        enabled: true
        cost_weight: 2.0
        cost_power: 1
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8                             # enlarged for better local obstacle awareness
      height: 8
      resolution: 0.05
      footprint: "[ [0.60, 0.40], [0.60, -0.40], [-0.60, -0.40], [-0.60, 0.40] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5           # softer falloff for outdoor terrain
        inflation_radius: 0.85
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: lidar
        lidar:
          topic: /lidar_00/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.15        # ignore ground returns below 15cm
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.3          # ignore rover body (within 30cm of lidar)
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0               # increased for mapping mode
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.60, 0.40], [0.60, -0.40], [-0.60, -0.40], [-0.60, 0.40] ]"
      resolution: 0.05
      rolling_window: false
      width: 20                           # 100x100m map window for outdoor use
      height: 20
      origin_x: -10.0
      origin_y: -10.0
      track_unknown_space: true           # treat unmapped areas as unknown (safer)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: /lidar_00/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.85
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0       # global planner runs at 1Hz (not 20Hz — avoid stalling)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0             # more time for large outdoor map
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 1.0
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      use_quadratic_cost_penalty: false
      smooth_path: true
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
      refinement_num: 2

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5             # relaxed — outdoor odometry can drift

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"                # CLOSED_LOOP requires valid odom; OPEN_LOOP safer when odom lags
    max_velocity: [0.8, 0.0, 1.0]
    min_velocity: [-0.4, 0.0, -1.0]
    max_accel: [1.5, 0.0, 1.0]
    max_decel: [-1.5, 0.0, -1.0]
    odom_topic: "/localization/odometry/filtered"   # EKF output topic
    odom_duration: 0.1

collision_monitor:
  ros__parameters:
    enabled: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 0.5
      simulation_time_step: 0.02
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/lidar_00/points"
      min_height: 0.15
      max_height: 2.0
      enabled: true