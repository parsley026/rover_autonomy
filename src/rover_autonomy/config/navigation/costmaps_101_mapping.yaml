global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [0.60, 0.40], [0.60, -0.40], [-0.60, -0.40], [-0.60, 0.40] ]'
      global_frame: map
      height: 25
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        camera1:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /camera_01/points
        enabled: true
        lidar:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          topic: /lidar_00/points
        observation_sources: lidar camera1
        plugin: nav2_costmap_2d::ObstacleLayer
      origin_x: -12.5
      origin_y: -12.5
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: false
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: false
      update_frequency: 1.0
      width: 25
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [0.60, 0.40], [0.60, -0.40], [-0.60, -0.40], [-0.60, 0.40] ]'
      global_frame: odom
      height: 5
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - voxel_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 5.0
      voxel_layer:
        camera1:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /camera_01/points
        enabled: true
        lidar:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          topic: /lidar_00/points
        mark_threshold: 0
        max_obstacle_height: 2.0
        observation_sources: lidar camera1
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: true
        z_resolution: 0.05
        z_voxels: 16
      width: 5
