/**:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: false               
    publish_tf: true               

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link  
    world_frame: odom

    # --- SENSOR 1: LiDAR (Must start at odom0) ---
    odom0: /lidar_00/odom           
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: true

    # --- SENSOR 2: Camera RGB-D ---
    odom1: /camera_00/odom
    odom1_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false       
    odom1_relative: true